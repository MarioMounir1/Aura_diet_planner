name: aura_diet_planner
description: "Aura Diet Planner — Volcanic-Nutrition-Engine powered tactical nutrition app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Local persistence (save base URL config)
  shared_preferences: ^2.3.1

  # JSON serialization helpers
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
